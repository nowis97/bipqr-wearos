name: Build and Release APKs

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs (Wear OS & Mobile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs
        run: ./gradlew :wear:assembleDebug :mobile:assembleDebug --stacktrace

      - name: Prepare APK outputs
        run: |
          mkdir -p dist
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/bipqr-watch.apk
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/bipqr-mobile.apk
          echo "Generated APKs:"
          ls -lh dist/

      - name: Upload Watch APK (Wear OS)
        uses: actions/upload-artifact@v4
        with:
          name: bipqr-watch-apk
          path: dist/bipqr-watch.apk
          retention-days: 30

      - name: Upload Mobile APK (Android Phone)
        uses: actions/upload-artifact@v4
        with:
          name: bipqr-mobile-apk
          path: dist/bipqr-mobile.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bipqr-watch.apk
            dist/bipqr-mobile.apk
          generate_release_notes: true
