name: Build and Release Watch APK

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wear OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests and Build Wear OS Debug APK
        run: ./gradlew :wear:testDebugUnitTest :wear:assembleDebug --stacktrace

      - name: Prepare APK output
        run: |
          mkdir -p dist
          APK_PATH=$(find wear/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK generated in wear/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at $APK_PATH, copying to dist/bipqr-watch.apk"
          cp "$APK_PATH" dist/bipqr-watch.apk
          echo "Generated APK:"
          ls -lh dist/

      - name: Upload Watch APK (Wear OS)
        uses: actions/upload-artifact@v4
        with:
          name: bipqr-watch-apk
          path: dist/bipqr-watch.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bipqr-watch.apk
          generate_release_notes: true
