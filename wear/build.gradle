plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nowis.bipwear'
    compileSdk 34

    defaultConfig {
        applicationId "com.nowis.bipwear"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-wear"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    // Google Play Services Wearable (comunicación con el teléfono)
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // Wear OS Jetpack Compose & Activity Compose
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.wear.compose:compose-material:1.3.0'
    implementation 'androidx.wear.compose:compose-foundation:1.3.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.2'

    // Wear OS y AndroidX base
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ViewModel Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Corrutinas Kotlin + Task await
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // RemoteActivityHelper para abrir ClaveÚnica en el navegador del teléfono sin app complementaria
    implementation 'androidx.wear:wear-remote-interactions:1.0.0'

    // ZXing (generación local de código Aztec) y BouncyCastle (EC secp224r1 + SHA224withECDSA)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    // Wear OS Tiles & ProtoLayout
    implementation 'androidx.wear.tiles:tiles:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout:1.2.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.2.0'

    // Watch Face Complications Data Source
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
