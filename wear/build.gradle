plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nowis.bipwear'
    compileSdk 34

    defaultConfig {
        applicationId "com.nowis.bipwear"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-wear"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Google Play Services Wearable (comunicación con el teléfono)
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // UI Wear OS y AndroidX
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Corrutinas Kotlin + Task await
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ZXing (generación local de código Aztec) y BouncyCastle (EC secp224r1 + SHA224withECDSA)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
